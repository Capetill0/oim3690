<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Rating    </title>
</head>
<body>
    <h1>Star Rating</h1>
  <div id="stars"></div>
  <input id="ratingInput" type="number" min="0" max="5" value="3">
  <button id="setBtn">Set rating</button>
  <script>
    let rating = 3;
    const container = document.querySelector('#stars');
    const input = document.getElementById('ratingInput');
    const btn = document.getElementById('setBtn');

    function render() {
      let stars = '';
      for (let i = 0; i < 5; i++) {
        if (i < rating) {
          stars += '★';
        } else {
          stars += '☆';
        }
      }
      container.textContent = stars; // e.g. ★★★☆☆
    }

    btn.onclick = function() {
      const v = parseInt(input.value, 10);
      if (Number.isNaN(v)) return;
      // clamp between 0 and 5
      rating = Math.max(0, Math.min(5, v));
      render();
    };

    render();
  </script>
</body>
</html>
